# generic testting

version: 2

models:
  - name: stg_jaffle_shop_customers
    description: one unique customer per row
    columns:
      - name: customer_id
        # qiky osht dokumentim me description
        description: primary key
        tests:
          - unique
          - not_null

  - name: stg_jaffle_shop_orders
    description: one order per row
    columns:
      - name: order_id
        description:  primary key
        tests:
          - unique
          - not_null
      - name: status
      # e ktu description mujm me marr prej file tjeter
        description: "{{doc('order_status')}}"
        tests:
          - accepted_values:
              values: ['shipped', 'completed', 'return pending']

      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id